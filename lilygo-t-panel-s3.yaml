esphome:
  name: lilygo-t-panel-s3
  friendly_name: "Lilygo T-Panel S3"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# CST3240 touch driver
external_components:
  - source:
      type: local
      path: components
    components: [cst3240]

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - lvgl.label.update:
          id: ha_status_label
          text: "HA Connected"
          text_color: 0x22C55E
  on_client_disconnected:
    then:
      - lvgl.label.update:
          id: ha_status_label
          text: "HA Offline"
          text_color: 0xEF4444

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none

psram:
  mode: quad
  speed: 80MHz

# I2C Bus for XL9535 expander and CST3240 touch
i2c:
  - id: tp_i2c
    sda: 17
    scl: 18
    scan: true
    frequency: 400kHz

# Onboard 16-bit IO expander
xl9535:
  - id: expander
    address: 0x20

# Touchscreen controller
touchscreen:
  - platform: cst3240
    id: my_touchscreen
    display: st7701s_disp
    i2c_id: tp_i2c
    address: 0x5A
    interrupt_pin: GPIO21
    reset_pin:
      xl9535: expander
      number: 4
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480

# Backlight on GPIO14
output:
  - platform: ledc
    id: backlight_output
    pin: 14
    frequency: 1220Hz
    inverted: false
    min_power: 10%

light:
  - platform: monochromatic
    output: backlight_output
    name: "T-Panel Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

# 3-wire SPI for ST7701S initialization via XL9535
spi:
  - id: lcd_spi
    interface: software
    mosi_pin:
      xl9535:
      number: 16
    clk_pin:
      xl9535:
      number: 15

# 480x480 RGB display
display:
  - platform: mipi_rgb
    model: t-panel-s3
    id: st7701s_disp

# Dashboard UI
lvgl:
  displays:
    - st7701s_disp
  touchscreens:
    - my_touchscreen
  bg_color: 0x0F1218

  widgets:
    # --- Top Navigation / Header Bar ---
    - label:
        x: 20
        y: 18
        text: "Home Assistant"
        text_color: 0xF1F5F9
        text_font: montserrat_20

    - label:
        id: ha_status_label
        x: 320
        y: 22
        width: 140
        text: "HA Offline"
        text_color: 0xEF4444
        text_font: montserrat_14
        text_align: right

    # Subtle divider
    - obj:
        x: 20
        y: 52
        width: 440
        height: 2
        bg_color: 0x1E293B
        border_width: 0

    # --- Quick Scene Pills ---
    - button:
        x: 20
        y: 66
        width: 135
        height: 42
        radius: 10
        bg_color: 0x1E293B
        border_width: 1
        border_color: 0x334155
        text: "All Off"
        on_click:
          - homeassistant.service:
              service: light.turn_off
              data:
                entity_id: all

    - button:
        x: 172
        y: 66
        width: 135
        height: 42
        radius: 10
        bg_color: 0x1E293B
        border_width: 1
        border_color: 0x334155
        text: "Relax"
        on_click:
          - homeassistant.service:
              service: scene.turn_on
              data:
                entity_id: scene.relax

    - button:
        x: 325
        y: 66
        width: 135
        height: 42
        radius: 10
        bg_color: 0x1E293B
        border_width: 1
        border_color: 0x334155
        text: "Bright"
        on_click:
          - homeassistant.service:
              service: light.turn_on
              data:
                entity_id: light.overhead_lights

    # --- 6 Button Grid ---
    - button:
        x: 20
        y: 114
        width: 212
        height: 66
        radius: 12
        bg_color: 0x1E2D44
        border_width: 2
        border_color: 0x3B82F6
        text: "Study Light"
        on_click:
          - homeassistant.service:
              service: light.toggle
              data:
                entity_id: light.study_light

    - button:
        x: 248
        y: 114
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Overhead"
        on_click:
          - homeassistant.service:
              service: light.toggle
              data:
                entity_id: light.overhead_lights

    - button:
        x: 20
        y: 190
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Kitchen"
        on_click:
          - homeassistant.service:
              service: light.toggle
              data:
                entity_id: light.kitchen_lights

    - button:
        x: 248
        y: 190
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Dining Room"
        on_click:
          - homeassistant.service:
              service: light.toggle
              data:
                entity_id: light.dining_room_lights

    - button:
        x: 20
        y: 266
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Living Mood"
        on_click:
          - homeassistant.service:
              service: light.toggle
              data:
                entity_id: light.living_room_mood_lights

    - button:
        x: 248
        y: 266
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "All Lights Off"
        on_click:
          - homeassistant.service:
              service: light.turn_off
              data:
                entity_id: all

    # --- Backlight Slider Card at Bottom ---
    - obj:
        x: 20
        y: 348
        width: 440
        height: 110
        radius: 14
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        widgets:
          - label:
              x: 14
              y: 12
              text: "Display Backlight"
              text_color: 0x94A3B8
              text_font: montserrat_14

          - slider:
              x: 14
              y: 48
              width: 412
              height: 28
              radius: 14
              min_value: 10
              max_value: 100
              value: 80
              on_value:
                - light.turn_on:
                    id: lcd_backlight
                    brightness: !lambda "return x / 100.0;"
