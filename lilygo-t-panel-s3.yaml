# Light control cycling scripts
script:
  - id: cycle_living
    then:
      - lambda: 'id(step_living) = (id(step_living) + 1) % 5;'
      - if:
          condition:
            lambda: 'return id(step_living) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.overhead_lights
            - lvgl.button.update:
                id: btn_living
                bg_color: 0x18202F
                border_color: 0x2A374F
                text: "Living Room\nOff"
      - if:
          condition:
            lambda: 'return id(step_living) == 1;'
          then:
            - homeassistant.service:
                service: light.turn_on
