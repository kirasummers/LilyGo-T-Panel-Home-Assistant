esphome:
  name: lilygo-t-panel-s3
  friendly_name: "Lilygo T-Panel S3"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# CST3240 touch driver
external_components:
  - source:
      type: local
      path: components
    components: [cst3240]

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - lvgl.label.update:
          id: ha_status_label
          text: "HA Connected"
          text_color: 0x22C55E
  on_client_disconnected:
    then:
      - lvgl.label.update:
          id: ha_status_label
          text: "HA Offline"
          text_color: 0xEF4444

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none

psram:
  mode: quad
  speed: 80MHz

# I2C Bus for XL9535 expander and CST3240 touch
i2c:
  - id: tp_i2c
    sda: 17
    scl: 18
    scan: true
    frequency: 400kHz

# Onboard 16-bit IO expander
xl9535:
  - id: expander
    address: 0x20

# Touchscreen controller
touchscreen:
  - platform: cst3240
    id: my_touchscreen
    display: st7701s_disp
    i2c_id: tp_i2c
    address: 0x5A
    interrupt_pin: GPIO21
    reset_pin:
      xl9535: expander
      number: 4
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480

# Backlight on GPIO14
output:
  - platform: ledc
    id: backlight_output
    pin: 14
    frequency: 1220Hz
    inverted: false
    min_power: 10%

light:
  - platform: monochromatic
    output: backlight_output
    name: "T-Panel Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

# 3-wire SPI for ST7701S initialization via XL9535
spi:
  - id: lcd_spi
    interface: software
    mosi_pin:
      xl9535: expander
      number: 16
    clk_pin:
      xl9535: expander
      number: 15

# 480x480 RGB display
display:
  - platform: mipi_rgb
    model: t-panel-s3
    id: st7701s_disp

# Discrete brightness states: 0=Off, 1=Very Low (10%), 2=Low (35%), 3=Medium (70%), 4=Bright (100%)
globals:
  - id: step_living
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_kitchen
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_dining
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_mood
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_tom
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_jerry
    type: int
    restore_value: no
    initial_value: '0'

# Home Assistant environmental sensors
sensor:
  - platform: homeassistant
    id: ha_indoor_temp
    entity_id: sensor.t_h_sensor_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: indoor_climate_label
            text: !lambda |-
              char buf[64];
              float hum = id(ha_indoor_hum).state;
              if (isnan(hum)) {
                snprintf(buf, sizeof(buf), "Inside: %.1f°C", x);
              } else {
                snprintf(buf, sizeof(buf), "Inside: %.1f°C  •  %.0f%%", x, hum);
              }
              return std::string(buf);

  - platform: homeassistant
    id: ha_indoor_hum
    entity_id: sensor.t_h_sensor_humidity
    on_value:
      then:
        - lvgl.label.update:
            id: indoor_climate_label
            text: !lambda |-
              char buf[64];
              float temp = id(ha_indoor_temp).state;
              if (isnan(temp)) {
                snprintf(buf, sizeof(buf), "Inside: --  •  %.0f%%", x);
              } else {
                snprintf(buf, sizeof(buf), "Inside: %.1f°C  •  %.0f%%", temp, x);
              }
              return std::string(buf);

  - platform: homeassistant
    id: ha_outdoor_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: outdoor_weather_label
            text: !lambda |-
              char buf[64];
              std::string cond = id(ha_weather_cond).state;
              if (cond.empty()) {
                snprintf(buf, sizeof(buf), "Outside: %.1f°C", x);
              } else {
                snprintf(buf, sizeof(buf), "Outside: %.1f°C  •  %s", x, cond.c_str());
              }
              return std::string(buf);

text_sensor:
  - platform: homeassistant
    id: ha_weather_cond
    entity_id: weather.forecast_home
    on_value:
      then:
        - lvgl.label.update:
            id: outdoor_weather_label
            text: !lambda |-
              char buf[64];
              float temp = id(ha_outdoor_temp).state;
              std::string cond = x;
              if (!cond.empty()) {
                cond[0] = toupper(cond[0]);
                for (size_t i = 1; i < cond.size(); ++i) {
                  if (cond[i] == '-' || cond[i] == '_') {
                    cond[i] = ' ';
                    if (i + 1 < cond.size()) cond[i + 1] = toupper(cond[i + 1]);
                  }
                }
              }
              if (isnan(temp)) {
                snprintf(buf, sizeof(buf), "Outside: %s", cond.c_str());
              } else {
                snprintf(buf, sizeof(buf), "Outside: %.1f°C  •  %s", temp, cond.c_str());
              }
              return std::string(buf);

# Home Assistant light state tracking
binary_sensor:
  - platform: homeassistant
    id: ha_state_living
    entity_id: light.overhead_lights
    on_release:
      then:
        - lambda: 'id(step_living) = 0;'
        - lvgl.button.update:
            id: btn_living
            bg_color: 0x18202F
            border_color: 0x2A374F
            text: "Living Room\nOff"
    on_press:
      then:
        - lambda: |-
            if (id(step_living) == 0) {
              id(step_living) = 4;
              // Only update display if not actively cycling
            }
        - if:
            condition:
              lambda: 'return id(step_living) == 4;'
            then:
              - lvgl.button.update:
                  id: btn_living
                  bg_color: 0x3B82F6
                  border_color: 0x93C5FD
