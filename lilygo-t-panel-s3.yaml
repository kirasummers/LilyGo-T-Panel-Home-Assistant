  - id: reset_all_buttons
    then:
      - lambda: |-
          id(step_living) = 0;
          id(step_kitchen) = 0;
          id(step_dining) = 0;
          id(step_mood) = 0;
          id(step_tom) = 0;
          id(step_jerry) = 0;
      - lvgl.button.update:
          id: btn_living
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Living Room\nOff"
      - lvgl.button.update:
          id: btn_kitchen
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Kitchen\nOff"
      - lvgl.button.update:
          id: btn_dining
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Dining Room\nOff"
      - lvgl.button.update:
          id: btn_mood
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Living Mood\nOff"
      - lvgl.button.update:
          id: btn_tom
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Tom\nOff"
      - lvgl.button.update:
          id: btn_jerry
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Jerry\nOff"

# Dashboard UI
lvgl:
  displays:
    - st7701s_disp
  touchscreens:
    - my_touchscreen
  bg_color: 0x0F1218

  widgets:
    # --- Top Navigation / Header Bar ---
    - label:
        x: 20
        y: 14
        text: "Home Assistant"
        text_color: 0xF1F5F9
        text_font: montserrat_18

    - label:
        id: ha_status_label
        x: 300
        y: 16
        width: 160
        text: "HA Offline"
        text_color: 0xEF4444
        text_font: montserrat_14
        text_align: right

    # --- Environmental Overview & All Off Pill ---
    - obj:
        x: 20
        y: 42
        width: 285
        height: 60
        radius: 10
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        scrollable: false
        scrollbar_mode: "OFF"
        pad_all: 0
        widgets:
          - label:
              id: indoor_climate_label
              x: 12
              y: 8
              text: "Inside: --.-°C  •  --%"
              text_color: 0x38BDF8
              text_font: montserrat_14

          - label:
              id: outdoor_weather_label
              x: 12
              y: 32
              text: "Outside: --.-°C  •  --"
              text_color: 0x94A3B8
              text_font: montserrat_14

    - button:
        id: btn_all_off
        x: 315
        y: 42
        width: 145
        height: 60
        radius: 10
        bg_color: 0x2D1B22
        border_width: 1
        border_color: 0x991B1B
        text: "All Off"
        on_click:
          - homeassistant.service:
              service: light.turn_off
              data:
                entity_id: all
          - script.execute: reset_all_buttons

    # --- 6 Button Grid ---
    # Row 1: Living Room | Kitchen
    - button:
        id: btn_living
        x: 20
        y: 114
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Living Room\nOff"
        on_click:
          - script.execute: cycle_living

    - button:
        id: btn_kitchen
        x: 248
        y: 114
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Kitchen\nOff"
        on_click:
          - script.execute: cycle_kitchen

    # Row 2: Dining Room | Living Mood
    - button:
        id: btn_dining
        x: 20
        y: 190
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Dining Room\nOff"
        on_click:
          - script.execute: cycle_dining

    - button:
        id: btn_mood
        x: 248
        y: 190
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Living Mood\nOff"
        on_click:
          - script.execute: cycle_mood

    # Row 3: Tom | Jerry
    - button:
        id: btn_tom
        x: 20
        y: 266
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Tom\nOff"
        on_click:
          - script.execute: cycle_tom

    - button:
        id: btn_jerry
        x: 248
        y: 266
        width: 212
        height: 66
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Jerry\nOff"
        on_click:
          - script.execute: cycle_jerry

    # --- Backlight Slider Card at Bottom ---
    - obj:
        x: 20
        y: 346
        width: 440
        height: 114
        radius: 14
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        scrollable: false
        scrollbar_mode: "OFF"
        pad_all: 0
        widgets:
          - label:
              x: 20
              y: 12
              text: "Display Backlight"
              text_color: 0x94A3B8
              text_font: montserrat_14

          - slider:
              x: 25
              y: 48
              width: 390
              height: 28
              radius: 14
              min_value: 10
              max_value: 100
              value: 80
              on_value:
                - light.turn_on:
                    id: lcd_backlight
                    brightness: !lambda "return x / 100.0;"
