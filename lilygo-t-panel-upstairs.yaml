esphome:
  name: lilygo-t-panel-upstairs
  friendly_name: "Lilygo T-Panel Upstairs"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# CST3240 touch driver
external_components:
  - source:
      type: local
      path: components
    components: [cst3240]

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - lvgl.label.update:
          id: ha_status_label
          text: "HA Connected"
          text_color: 0x22C55E
  on_client_disconnected:
    then:
      - lvgl.label.update:
          id: ha_status_label
          text: "HA Offline"
          text_color: 0xEF4444

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  use_address: lilygo-t-panel-upstairs.local

psram:
  mode: quad
  speed: 80MHz

# I2C Bus for XL9535 expander and CST3240 touch
i2c:
  - id: tp_i2c
    sda: 17
    scl: 18
    scan: true
    frequency: 400kHz

# Onboard 16-bit IO expander
xl9535:
  - id: expander
    address: 0x20

# Touchscreen controller
touchscreen:
  - platform: cst3240
    id: my_touchscreen
    display: st7701s_disp
    i2c_id: tp_i2c
    address: 0x5A
    interrupt_pin: GPIO21
    reset_pin:
      xl9535: expander
      number: 4
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480

# Backlight on GPIO14
output:
  - platform: ledc
    id: backlight_output
    pin: 14
    frequency: 1220Hz
    inverted: false
    min_power: 10%

light:
  - platform: monochromatic
    output: backlight_output
    name: "T-Panel Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

# 3-wire SPI for ST7701S initialization via XL9535
spi:
  - id: lcd_spi
    interface: software
    mosi_pin:
      xl9535: expander
      number: 16
    clk_pin:
      xl9535: expander
      number: 15

# 480x480 RGB display
display:
  - platform: mipi_rgb
    model: t-panel-s3
    id: st7701s_disp

# Discrete brightness states: 0=Off, 1=Very Low (10%), 2=Low (35%), 3=Medium (70%), 4=Bright (100%)
globals:
  - id: step_kira
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_lamp
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_landing
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_starlight
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_rayven
    type: int
    restore_value: no
    initial_value: '0'
  - id: step_rayven_mood
    type: int
    restore_value: no
    initial_value: '0'

# Home Assistant environmental sensors
sensor:
  - platform: homeassistant
    id: ha_indoor_temp
    entity_id: sensor.t_h_sensor_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: indoor_temp_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f°C", x);
              return std::string(buf);

  - platform: homeassistant
    id: ha_indoor_hum
    entity_id: sensor.t_h_sensor_humidity
    on_value:
      then:
        - lvgl.label.update:
            id: indoor_hum_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.0f%% RH", x);
              return std::string(buf);

  - platform: homeassistant
    id: ha_outdoor_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: outdoor_temp_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f°C", x);
              return std::string(buf);

text_sensor:
  - platform: homeassistant
    id: ha_weather_cond
    entity_id: weather.forecast_home
    on_value:
      then:
        - lvgl.label.update:
            id: weather_cond_label
            text: !lambda |-
              std::string cond = x;
              if (!cond.empty()) {
                cond[0] = toupper(cond[0]);
                for (size_t i = 1; i < cond.size(); ++i) {
                  if (cond[i] == '-' || cond[i] == '_') {
                    cond[i] = ' ';
                    if (i + 1 < cond.size()) cond[i + 1] = toupper(cond[i + 1]);
                  }
                }
              }
              return cond;

# Home Assistant light state tracking
binary_sensor:
  - platform: homeassistant
    id: ha_state_kira
    entity_id: light.kira_s_light
    on_release:
      then:
        - lambda: 'id(step_kira) = 0;'
        - lvgl.button.update:
            id: btn_kira
            bg_color: 0x18202F
            border_color: 0x2A374F
            text: "Kira's Room\nOff"
    on_press:
      then:
        - lambda: |-
            if (id(step_kira) == 0) {
              id(step_kira) = 4;
