# Light control cycling scripts
script:
  - id: cycle_kira
    then:
      - lambda: 'id(step_kira) = (id(step_kira) + 1) % 5;'
      - if:
          condition:
            lambda: 'return id(step_kira) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.kira_s_light
            - lvgl.button.update:
                id: btn_kira
                bg_color: 0x18202F
                border_color: 0x2A374F
                text: "Kira's Room\nOff"
