          id(step_lamp) = 0;
          id(step_landing) = 0;
          id(step_starlight) = 0;
          id(step_rayven) = 0;
          id(step_rayven_mood) = 0;
      - lvgl.button.update:
          id: btn_kira
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Kira's Room\nOff"
      - lvgl.button.update:
          id: btn_lamp
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Bedroom Lamp\nOff"
      - lvgl.button.update:
          id: btn_landing
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Landing Light\nOff"
      - lvgl.button.update:
          id: btn_starlight
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Starlight\nOff"
      - lvgl.button.update:
          id: btn_rayven
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Rayven's Room\nOff"
      - lvgl.button.update:
          id: btn_rayven_mood
          bg_color: 0x18202F
          border_color: 0x2A374F
          text: "Rayven Mood\nOff"

# Dashboard UI
lvgl:
  displays:
    - st7701s_disp
  touchscreens:
    - my_touchscreen
  bg_color: 0x0F1218

  widgets:
    # --- Top Navigation / Header Bar ---
    - label:
        x: 20
        y: 12
        text: "Home Assistant"
        text_color: 0xF1F5F9
        text_font: montserrat_18

    - label:
        id: ha_status_label
        x: 300
        y: 14
        width: 160
        text: "HA Offline"
        text_color: 0xEF4444
        text_font: montserrat_14
        text_align: right

    # --- Environmental Cards & All Off Pill ---
    # Card 1: Inside Climate
    - obj:
        x: 20
        y: 38
        width: 140
        height: 72
        radius: 12
        bg_color: 0x151D2A
        border_width: 1
        border_color: 0x233249
        scrollable: false
        scrollbar_mode: "OFF"
        pad_all: 0
        widgets:
          - label:
              x: 12
              y: 8
              text: "INSIDE"
              text_color: 0x38BDF8
              text_font: montserrat_12
          - label:
              id: indoor_temp_label
              x: 12
              y: 24
              text: "--.-°C"
              text_color: 0xF8FAFC
              text_font: montserrat_20
          - label:
              id: indoor_hum_label
              x: 12
              y: 48
              text: "--% RH"
              text_color: 0x94A3B8
              text_font: montserrat_12

    # Card 2: Outside Weather
    - obj:
        x: 170
        y: 38
        width: 155
        height: 72
        radius: 12
        bg_color: 0x151D2A
        border_width: 1
        border_color: 0x233249
        scrollable: false
        scrollbar_mode: "OFF"
        pad_all: 0
        widgets:
          - label:
              x: 12
              y: 8
              text: "OUTSIDE"
              text_color: 0xFBBF24
              text_font: montserrat_12
          - label:
              id: outdoor_temp_label
              x: 12
              y: 24
              text: "--.-°C"
              text_color: 0xF8FAFC
              text_font: montserrat_20
          - label:
              id: weather_cond_label
              x: 12
              y: 48
              text: "Waiting..."
              text_color: 0x94A3B8
              text_font: montserrat_12

    # Card 3: All Off Pill Button
    - button:
        id: btn_all_off
        x: 335
        y: 38
        width: 125
        height: 72
        radius: 12
        bg_color: 0x281419
        border_width: 1
        border_color: 0x991B1B
        text: "ALL OFF"
        text_font: montserrat_16
        on_click:
          - homeassistant.service:
              service: light.turn_off
              data:
                entity_id: all
          - script.execute: reset_all_buttons

    # --- 6 Button Grid ---
    # Row 1: Kira's Room | Bedroom Lamp
    - button:
        id: btn_kira
        x: 20
        y: 122
        width: 212
        height: 76
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Kira's Room\nOff"
        on_click:
          - script.execute: cycle_kira

    - button:
        id: btn_lamp
        x: 248
        y: 122
        width: 212
        height: 76
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Bedroom Lamp\nOff"
        on_click:
          - script.execute: cycle_lamp

    # Row 2: Landing Light | Starlight
    - button:
        id: btn_landing
        x: 20
        y: 210
        width: 212
        height: 76
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Landing Light\nOff"
        on_click:
          - script.execute: cycle_landing

    - button:
        id: btn_starlight
        x: 248
        y: 210
        width: 212
        height: 76
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Starlight\nOff"
        on_click:
          - script.execute: cycle_starlight

    # Row 3: Rayven's Room | Rayven Mood
    - button:
        id: btn_rayven
        x: 20
        y: 298
        width: 212
        height: 76
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Rayven's Room\nOff"
        on_click:
          - script.execute: cycle_rayven

    - button:
        id: btn_rayven_mood
        x: 248
        y: 298
        width: 212
        height: 76
        radius: 12
        bg_color: 0x18202F
        border_width: 1
        border_color: 0x2A374F
        text: "Rayven Mood\nOff"
        on_click:
          - script.execute: cycle_rayven_mood

    # --- Sleek Backlight Slider Card at Bottom ---
    - obj:
        x: 20
        y: 392
        width: 440
        height: 64
        radius: 12
        bg_color: 0x151D2A
        border_width: 1
        border_color: 0x233249
        scrollable: false
        scrollbar_mode: "OFF"
        pad_all: 0
        widgets:
          - label:
              x: 18
              y: 22
              text: "Backlight"
              text_color: 0x94A3B8
              text_font: montserrat_14

          - slider:
              x: 110
              y: 23
              width: 310
              height: 18
              radius: 9
              min_value: 10
              max_value: 100
              value: 80
              on_value:
                - light.turn_on:
                    id: lcd_backlight
                    brightness: !lambda "return x / 100.0;"
